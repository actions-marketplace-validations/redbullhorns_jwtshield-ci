# Auto-publish jwtshield-ci to GitHub Marketplace on tag push.
# Tag flow:
#   git tag v1.0.0 && git push origin v1.0.0
# This workflow validates action.yml + README + scripts, runs a smoke test,
# then forces the floating @v1 tag to the new release commit.
#
# Security: all event-derived inputs are routed through env: bindings,
# never inlined into run: scripts. Tag names are validated with a strict
# regex before use.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify required files
        run: |
          set -euo pipefail
          for f in action.yml README.md scripts/run.sh; do
            if [ ! -f "$f" ]; then
              echo "::error::missing required file $f"
              exit 1
            fi
          done
          if [ ! -x scripts/run.sh ]; then
            chmod +x scripts/run.sh
          fi

      - name: Lint shell script
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/run.sh || true
          fi

      - name: Validate action.yml top-level keys
        run: |
          set -euo pipefail
          for required in name description runs inputs outputs; do
            if ! grep -q "^${required}:" action.yml; then
              echo "::error::action.yml missing top-level: ${required}"
              exit 1
            fi
          done

  smoke-self-test:
    name: Self-test the action
    runs-on: ubuntu-latest
    needs: validate
    env:
      STAGING_API_KEY: ${{ secrets.JWTSHIELD_STAGING_API_KEY }}
      STAGING_ENDPOINT: ${{ vars.JWTSHIELD_STAGING_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - name: Run jwtshield-ci against staging (lint mode)
        id: jwt
        uses: ./
        with:
          api-key: ${{ env.STAGING_API_KEY }}
          issuer: https://login.example.com
          audience: api://test
          fail-on-severity: critical
          fail-mode: soft
          endpoint: ${{ env.STAGING_ENDPOINT }}

      - name: Echo outputs
        env:
          STATUS: ${{ steps.jwt.outputs.status }}
          FINDINGS: ${{ steps.jwt.outputs.findings-count }}
          EVIDENCE: ${{ steps.jwt.outputs.evidence-url }}
        run: |
          echo "status=$STATUS"
          echo "findings-count=$FINDINGS"
          echo "evidence-url=$EVIDENCE"

  promote-floating-major:
    name: Promote floating @v{major}
    runs-on: ubuntu-latest
    needs: [validate, smoke-self-test]
    env:
      TAG_REF: ${{ github.ref }}
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate semver tag and compute major
        id: major
        run: |
          set -euo pipefail
          TAG="${TAG_REF#refs/tags/}"
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Skipping floating tag promotion for non-semver tag: $TAG"
            echo "major=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MAJOR=$(printf '%s' "$TAG" | sed -E 's/^(v[0-9]+)\..*/\1/')
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - name: Force-update floating @v{major} tag
        if: steps.major.outputs.major != ''
        env:
          MAJOR_TAG: ${{ steps.major.outputs.major }}
        run: |
          set -euo pipefail
          # Strict tag-name validation: only v<digits>.
          if ! printf '%s' "$MAJOR_TAG" | grep -qE '^v[0-9]+$'; then
            echo "::error::refusing to push tag with unexpected name: $MAJOR_TAG"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR_TAG" "$COMMIT_SHA"
          git push origin "$MAJOR_TAG" --force
