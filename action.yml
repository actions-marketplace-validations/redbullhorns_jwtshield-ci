# jwtshield-ci@v1
# Catches JWKS rotation drift, audience mismatches, and OIDC config drift in CI.
# Free tier covers 200 verifies/month. https://jwtshield.com

name: 'JWTShield CI'
author: 'Blue Hills'
description: 'CI auth regression tests + JWKS rotation drift detection. Five lines.'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  api-key:
    description: |
      jwtshield API key. Get one at https://jwtshield.com/signup.
      Recommended: store as a GitHub Actions secret and reference as ${{ secrets.JWTSHIELD_API_KEY }}.
    required: true

  issuer:
    description: |
      Expected token issuer URL (e.g. https://login.example.com).
      Tokens with a different `iss` claim fail validation.
    required: true

  audience:
    description: |
      Expected audience claim (e.g. api://backend).
      Tokens with a different `aud` claim fail validation.
    required: true

  allowed-algs:
    description: |
      Comma-separated allowed signature algorithms (e.g. "RS256,ES256").
      Defaults to RS256 only. NEVER include `none`.
    required: false
    default: 'RS256'

  fail-on-severity:
    description: |
      Severity threshold. One of: low, medium, high, critical.
      Findings at or above this severity fail the build.
    required: false
    default: 'high'

  fail-mode:
    description: |
      How to behave when jwtshield.com is unreachable.
      `hard` (default): fail the CI step on jwtshield outage.
      `soft`: warn-only, exit 0, do not block the build.
    required: false
    default: 'hard'

  endpoint:
    description: |
      jwtshield API base URL. Override only for staging/self-host.
    required: false
    default: 'https://api.jwtshield.com'

  cache-ttl-seconds:
    description: |
      How long to cache the last successful response (used during outages in soft mode).
      Default 300 (5 minutes).
    required: false
    default: '300'

  token:
    description: |
      Optional: a real or synthetic JWT to validate against the policy above.
      If omitted, the action validates issuer config only (lint mode).
      Recommended: use synthetic tokens generated by your test fixtures, never production tokens.
    required: false
    default: ''

outputs:
  status:
    description: 'Overall result. One of: pass, fail, warn, degraded.'
    value: ${{ steps.run.outputs.status }}
  findings-count:
    description: 'Number of findings emitted at any severity.'
    value: ${{ steps.run.outputs.findings-count }}
  evidence-url:
    description: 'Public URL of the audit trail entry. Empty when degraded/cached.'
    value: ${{ steps.run.outputs.evidence-url }}

runs:
  using: 'composite'
  steps:
    - id: run
      shell: bash
      env:
        JWTSHIELD_API_KEY: ${{ inputs.api-key }}
        INPUT_ISSUER: ${{ inputs.issuer }}
        INPUT_AUDIENCE: ${{ inputs.audience }}
        INPUT_ALLOWED_ALGS: ${{ inputs.allowed-algs }}
        INPUT_FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        INPUT_FAIL_MODE: ${{ inputs.fail-mode }}
        INPUT_ENDPOINT: ${{ inputs.endpoint }}
        INPUT_CACHE_TTL_SECONDS: ${{ inputs.cache-ttl-seconds }}
        INPUT_TOKEN: ${{ inputs.token }}
      run: bash "${{ github.action_path }}/scripts/run.sh"
